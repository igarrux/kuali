[package]
name = "kuali-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kuali-core.workspace = true
kuali-llm.workspace = true
kuali-store.workspace = true

chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# `bundled` compiles SQLite from source so the index behaves identically on
# macOS and Windows instead of inheriting whatever the system ships.
rusqlite = { version = "0.37", features = ["bundled"] }

# Share Sherpa's static ONNX Runtime with diarization. Downloading ort's own
# static archive would link two runtimes and collide on Linux. Sherpa 1.13.7
# bundles runtime 1.27.1+ on the CI/release targets, compatible with API 27.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "api-27"] }
ort-sys = { version = "=2.0.0-rc.13", default-features = false, features = ["disable-linking"] }
sherpa-onnx-sys = "=1.13.7"
ndarray = "0.17"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[dev-dependencies]
# Only the tests await a provider; the crate itself hands the future to its caller.
tokio.workspace = true
