name: Release

# A tag is the only trigger: whatever `v*` points at is exactly what people
# install, so there is never a released build that no commit corresponds to.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Releases are never cancelled halfway: a partially uploaded release is worse
# than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS bundle
    # Apple Silicon runner, which is what Kuali ships for.
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg-sha256: ${{ steps.checksums.outputs.dmg }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          targets: aarch64-apple-darwin

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Read the version being released
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse a tag that disagrees with the manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          manifest=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$manifest" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json ($manifest)." >&2
            exit 1
          fi

      - name: Build the Chrome Web Store package
        run: npm --prefix browser-extension run package:store

      # Kuali's releases have always carried written notes. An annotated tag
      # is where they come from, so the description lives with the commit it
      # describes instead of being retyped into the web interface afterwards.
      - name: Open the release with the notes from the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release already exists; its notes are left as they are."
            exit 0
          fi
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" \
            --title "Kuali $VERSION" \
            --notes "${notes:-Kuali $VERSION.}"

      - name: Build the app and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the updater artifacts are unsigned, and an unsigned
          # update is one every installed copy will refuse.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kuali ${{ steps.version.outputs.version }}
          releaseDraft: false
          prerelease: false
          # latest.json is the updater endpoint; it has to ship with the build
          # it describes or installed copies check against a stale manifest.
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin

      - name: Checksum the disk image
        id: checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dmg="target/aarch64-apple-darwin/release/bundle/dmg/Kuali_${VERSION}_aarch64.dmg"
          digest=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          printf '%s  %s\n' "$digest" "$(basename "$dmg")" > "$dmg.sha256"
          echo "dmg=$digest" >> "$GITHUB_OUTPUT"

      - name: Attach the checksum and the extension package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "target/aarch64-apple-darwin/release/bundle/dmg/Kuali_${VERSION}_aarch64.dmg.sha256" \
            browser-extension/dist/*.zip \
            browser-extension/dist/*.zip.sha256 \
            --clobber

  tap:
    name: Homebrew tap
    needs: macos
    runs-on: ubuntu-24.04
    steps:
      # Publishing the release matters more than updating the cask, so a
      # missing token reports what to do instead of failing the release.
      - name: Check whether the tap can be updated
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, so the cask still points at the previous release. Update Casks/kuali.rb by hand or add the secret."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tap
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          repository: igarrux/homebrew-kuali
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Point the cask at the release that was just published
        if: steps.gate.outputs.ready == 'true'
        env:
          VERSION: ${{ needs.macos.outputs.version }}
          SHA256: ${{ needs.macos.outputs.dmg-sha256 }}
        run: |
          sed -i -E "s/^  version \".*\"$/  version \"${VERSION}\"/" Casks/kuali.rb
          sed -i -E "s/^  sha256 \".*\"$/  sha256 \"${SHA256}\"/" Casks/kuali.rb
          if git diff --quiet Casks/kuali.rb; then
            echo "The cask already points at ${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(cask): :bookmark: point Kuali at ${VERSION}"
          git push
