name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake libasound2-dev libayatana-appindicator3-dev libgtk-3-dev
          libopus-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  extension:
    name: Browser extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run extension tests
        run: npm test

      - name: Build Chrome Web Store package
        run: npm run package:store

  website:
    name: Static website
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install website tooling
        run: npm ci

      - name: Validate pages, SEO, links, and Cloudflare deployment
        run: npm run check:website
