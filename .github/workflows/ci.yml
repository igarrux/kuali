name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake libasound2-dev libayatana-appindicator3-dev libgtk-3-dev
          libopus-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  # Everything above runs on Linux, which never compiles the code that only
  # exists on macOS — the Seatbelt confinement, the Metal paths — and never
  # packages anything. Kuali ships for macOS, so both are checked here.
  macos:
    name: macOS workspace and bundle
    # Apple Silicon runner, which is what Kuali ships for. Free on a public
    # repository, so this costs wall-clock time and nothing else.
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          targets: aarch64-apple-darwin
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      # Building is not releasing. A tag remains the only thing that publishes,
      # so this produces the disk image and throws it away: what it proves is
      # that packaging still works, on the commit that broke it rather than
      # weeks later when someone cuts a release.
      #
      # Updater artifacts are switched off because signing them needs the
      # release key, which a pull request from a fork cannot reach. Every real
      # release signs them, so nothing here goes unchecked. The config path is
      # resolved from the repository root, not from `src-tauri`.
      - name: Build the bundle without publishing it
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target aarch64-apple-darwin --config src-tauri/tauri.ci.conf.json

  interface:
    name: Desktop interface
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test translations and interface contracts
        run: node --test src/i18n.test.mjs

  extension:
    name: Browser extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run extension tests
        run: npm test

      - name: Build Chrome Web Store package
        run: npm run package:store

  website:
    name: Static website
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install website tooling
        run: npm ci

      - name: Validate pages, SEO, links, and Cloudflare deployment
        run: npm run check:website
